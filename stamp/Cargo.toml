[package]
name = "stamp"
version = "0.0.1"
edition = "2024"
authors = ["Samuel Marks"]
license = "CC0 OR MIT OR Apache-2.0"
repository = "https://github.com/SamuelMarks/stamp"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
clap_complete = { version = "4.5", default-features = false }
libstamp = { path = "../libstamp" }
tokio = { version = "1.53", default-features = false, features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
derive_more = { version = "1.0", default-features = false }
