syntax = "proto3";
package packer;

service Builder {
    rpc Prepare (PrepareRequest) returns (PrepareResponse) {}
    rpc Run (RunRequest) returns (RunResponse) {}
    rpc Cancel (CancelRequest) returns (CancelResponse) {}
}

service Provisioner {
    rpc Prepare (PrepareRequest) returns (PrepareResponse) {}
    rpc Provision (ProvisionRequest) returns (ProvisionResponse) {}
    rpc Cancel (CancelRequest) returns (CancelResponse) {}
}

service PostProcessor {
    rpc Configure (ConfigureRequest) returns (ConfigureResponse) {}
    rpc PostProcess (PostProcessRequest) returns (PostProcessResponse) {}
}

service Datasource {
    rpc Execute (ExecuteRequest) returns (ExecuteResponse) {}
}

service Ui {
    rpc Say (SayRequest) returns (UiResponse) {}
    rpc Message (MessageRequest) returns (UiResponse) {}
    rpc Error (ErrorRequest) returns (UiResponse) {}
    rpc Ask (AskRequest) returns (AskResponse) {}
    rpc StreamEvents (stream UiEvent) returns (stream UiResponse) {}
}

service Communicator {
    rpc Execute (stream CommandStream) returns (stream CommandResponse) {}
    rpc Upload (stream FileChunk) returns (UploadResponse) {}
    rpc Download (DownloadRequest) returns (stream FileChunk) {}
}

service Hook {
    rpc Run (HookRunRequest) returns (HookRunResponse) {}
}

service Schema {
    rpc GetSchema (GetSchemaRequest) returns (GetSchemaResponse) {}
}

service Health {
    rpc Check (HealthCheckRequest) returns (HealthCheckResponse) {}
    rpc Watch (HealthCheckRequest) returns (stream HealthCheckResponse) {}
}

message PrepareRequest {
    repeated bytes configs = 1;
}

message PrepareResponse {
    repeated string warnings = 1;
    repeated string errors = 2;
}

message RunRequest {
    string config = 1;
    string build_name = 2;
}

message RunResponse {
    bool success = 1;
    string error = 2;
    string artifact_id = 3;
    string builder_id = 4;
    repeated string files = 5;
}

message CancelRequest {}

message CancelResponse {}

message ProvisionRequest {
    string communicator_type = 1;
}

message ProvisionResponse {
    bool success = 1;
    string error = 2;
}

message ConfigureRequest {
    repeated bytes configs = 1;
}

message ConfigureResponse {
    repeated string warnings = 1;
    repeated string errors = 2;
}

message PostProcessRequest {
    string artifact_id = 1;
    string builder_id = 2;
    repeated string files = 3;
}

message PostProcessResponse {
    bool success = 1;
    string error = 2;
    string artifact_id = 3;
    string builder_id = 4;
    repeated string files = 5;
    bool keep_input_artifact = 6;
}

message ExecuteRequest {
    repeated bytes configs = 1;
}

message ExecuteResponse {
    bytes output = 1;
    repeated string errors = 2;
}

message SayRequest {
    string target = 1;
    string message = 2;
}

message MessageRequest {
    string target = 1;
    string message = 2;
}

message ErrorRequest {
    string target = 1;
    string error = 2;
}

message AskRequest {
    string query = 1;
}

message AskResponse {
    string response = 1;
}

message UiResponse {}

message UiEvent {
    string target = 1;
    string message = 2;
    string event_type = 3;
}

message CommandStream {
    string command = 1;
    bytes stdin = 2;
}

message CommandResponse {
    bytes stdout = 1;
    bytes stderr = 2;
    int32 exit_code = 3;
    bool finished = 4;
}

message FileChunk {
    string path = 1;
    bytes data = 2;
    bool end = 3;
}

message UploadResponse {
    bool success = 1;
    string error = 2;
}

message DownloadRequest {
    string path = 1;
}

message HookRunRequest {
    string hook_name = 1;
    bytes data = 2;
}

message HookRunResponse {
    bool error = 1;
    string message = 2;
}

message GetSchemaRequest {
    string component_type = 1;
    string component_name = 2;
}

message GetSchemaResponse {
    string schema_json = 1;
    bool error = 2;
    string error_message = 3;
}

message HealthCheckRequest {
    string service = 1;
}

message HealthCheckResponse {
    enum ServingStatus {
        UNKNOWN = 0;
        SERVING = 1;
        NOT_SERVING = 2;
        SERVICE_UNKNOWN = 3;
    }
    ServingStatus status = 1;
}
