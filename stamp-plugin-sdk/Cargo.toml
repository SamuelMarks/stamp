[package]
name = "stamp-plugin-sdk"
version = "0.0.1"
edition = "2024"
authors = ["Samuel Marks"]
description = "SDK for authoring native Stamp and Packer plugins in Rust"
readme = "../README.md"
keywords = ["packer", "plugin", "sdk", "virtualization", "infrastructure"]
categories = ["development-tools"]
license = "CC0 OR MIT OR Apache-2.0"
repository = "https://github.com/SamuelMarks/stamp"

[dependencies]
libstamp = { path = "../libstamp" }
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "server"] }
tokio = { version = "1.54", default-features = false, features = ["net", "signal", "sync"] }
tokio-stream = { version = "0.1", default-features = false, features = ["net", "sync"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

[dev-dependencies]
async-trait = { version = "0.1", default-features = false }
tokio = { version = "1.54", default-features = false, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
